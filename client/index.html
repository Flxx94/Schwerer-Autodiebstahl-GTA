<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#101820" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>Stadtkampf</title>
    <style>
      :root { --ui: rgba(255,255,255,.18); --uib: rgba(255,255,255,.55); --acc: #ffb020; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; color: #fff;
        font: 15px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
      canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { position: absolute; }
      .zone { pointer-events: auto; touch-action: none; }
      #leftZone { left: 0; bottom: 0; width: 45%; height: 70%; }
      #rightZone { right: 0; bottom: 0; width: 55%; height: 70%; }
      .joy-base { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
        border: 2px solid var(--uib); background: var(--ui); display: none; }
      .joy-knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
        border-radius: 50%; background: var(--uib); }
      .btn { pointer-events: auto; touch-action: none; display: flex; align-items: center; justify-content: center;
        border-radius: 50%; border: 2px solid var(--uib); background: var(--ui); color: #fff; font-weight: 700;
        text-align: center; font-size: 13px; backdrop-filter: blur(2px); }
      .btn:active, .btn.on { background: rgba(255,176,32,.55); }
      #btnFire { right: calc(18px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 96px; height: 96px; font-size: 16px; }
      #btnWeapon { right: calc(110px + env(safe-area-inset-right)); bottom: calc(110px + env(safe-area-inset-bottom)); width: 62px; height: 62px; }
      #crosshair { left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; --g: 7px; }
      #crosshair i { position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.65); border-radius: 1px; transition: background .08s; }
      #crosshair .l { width: 10px; height: 2px; left: calc(-10px - var(--g)); top: -1px; }
      #crosshair .r { width: 10px; height: 2px; left: var(--g); top: -1px; }
      #crosshair .t { width: 2px; height: 10px; top: calc(-10px - var(--g)); left: -1px; }
      #crosshair .b { width: 2px; height: 10px; top: var(--g); left: -1px; }
      #crosshair .d { width: 3px; height: 3px; left: -1.5px; top: -1.5px; border-radius: 50%; }
      #crosshair.hot i { background: #ff4040; }
      #hud { left: calc(12px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); text-shadow: 0 1px 3px #000; }
      #hpbar { width: 150px; height: 12px; border: 2px solid var(--uib); border-radius: 7px; overflow: hidden; background: rgba(0,0,0,.35); }
      #hpfill { height: 100%; width: 100%; background: #4ade80; }
      #weaponName { display: none; }
      #roundBox { left: 50%; top: calc(34px + env(safe-area-inset-top)); transform: translateX(-50%); text-align: center; text-shadow: 0 1px 3px #000; }
      #roundTime { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
      #roundGoal { font-size: 11px; opacity: .85; }
      #endBoard { inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
      #endBoard .card { min-width: 260px; background: rgba(20,28,38,.92); border: 2px solid var(--uib); border-radius: 14px; padding: 14px 20px; }
      #endBoard h2 { margin: 0 0 8px; font-size: 22px; color: #ffd24a; }
      #endBoard .row { display: flex; justify-content: space-between; gap: 24px; font-size: 15px; padding: 2px 0; }
      #endBoard p { margin: 8px 0 0; font-size: 12px; opacity: .8; }
      #hitMark, #hitHead, #hitKill { left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; opacity: 0; pointer-events: none;
        background: linear-gradient(45deg, transparent 44%, #fff 44% 56%, transparent 56%), linear-gradient(-45deg, transparent 44%, #fff 44% 56%, transparent 56%); }
      #hitHead { filter: drop-shadow(0 0 4px #ffd24a); background: linear-gradient(45deg, transparent 44%, #ffd24a 44% 56%, transparent 56%), linear-gradient(-45deg, transparent 44%, #ffd24a 44% 56%, transparent 56%); }
      #hitKill { filter: drop-shadow(0 0 5px #ff3b3b); width: 40px; height: 40px; margin: -20px 0 0 -20px; background: linear-gradient(45deg, transparent 44%, #ff3b3b 44% 56%, transparent 56%), linear-gradient(-45deg, transparent 44%, #ff3b3b 44% 56%, transparent 56%); }
      .go { animation: pop .35s ease-out; }
      @keyframes pop { 0% { opacity: 1; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.25); } }
      #dmgFlash { inset: 0; opacity: 0; pointer-events: none; box-shadow: inset 0 0 90px 20px rgba(220,0,0,.7); }
      #dmgFlash.go { animation: dmg .5s ease-out; }
      @keyframes dmg { 0% { opacity: 1; } 100% { opacity: 0; } }
      #wHud { left: calc(12px + env(safe-area-inset-left)); bottom: calc(10px + env(safe-area-inset-bottom)); width: 215px; text-align: right; text-shadow: 0 1px 3px #000; pointer-events: none; }
      #wSlots { pointer-events: auto; }
      #wMain { background: var(--ui); border: 2px solid var(--uib); border-radius: 12px; padding: 6px 10px 8px; }
      #wIcon { font-size: 22px; float: left; line-height: 1.1; }
      #wMag { font-size: 30px; font-weight: 800; line-height: 1; }
      #wMagMax { font-size: 13px; opacity: .85; }
      #wName { font-size: 12px; font-weight: 700; margin-top: 2px; }
      #wState { font-size: 12px; min-height: 15px; color: #fca5a5; }
      #wRel { height: 6px; border-radius: 3px; background: rgba(0,0,0,.45); overflow: hidden; display: none; margin-top: 3px; }
      #wRelFill { height: 100%; width: 0; background: #ffb020; }
      #wSlots { display: flex; gap: 4px; margin-top: 6px; justify-content: flex-end; }
      .slot { font-size: 11px; padding: 3px 6px; border-radius: 8px; border: 1px solid var(--uib); background: rgba(0,0,0,.35); opacity: .7; }
      .slot.off { opacity: .25; }
      .slot.sel { background: rgba(255,176,32,.6); opacity: 1; font-weight: 700; }
      #btnReload { right: calc(190px + env(safe-area-inset-right)); bottom: calc(110px + env(safe-area-inset-bottom)); width: 62px; height: 62px; }
      #score { margin-top: 6px; font-size: 12px; opacity: .9; }
      #score .me { color: #ffd24a; font-weight: 700; }
      #minimap { right: calc(12px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); width: 112px; height: 112px; border-radius: 50%;
        border: 2px solid var(--uib); background: rgba(0,0,0,.35); }
      #ping { right: calc(130px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); font-size: 12px; opacity: .8; text-shadow: 0 1px 3px #000; }
      #feed { left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%); text-align: center; font-size: 13px; text-shadow: 0 1px 3px #000; }
      #toast { left: 50%; top: 22%; transform: translateX(-50%); text-align: center; font-size: 18px; font-weight: 700; text-shadow: 0 2px 4px #000; }
      #dead { inset: 0; display: none; align-items: center; justify-content: center; background: rgba(120,0,0,.35); font-size: 24px; font-weight: 800; text-shadow: 0 2px 6px #000; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #25405a, #0b1118); z-index: 10; padding: 16px; }
      #overlay .card { width: min(380px, 100%); display: flex; flex-direction: column; gap: 10px; }
      #overlay h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .5px; }
      #overlay p { margin: 0; opacity: .75; font-size: 13px; }
      #overlay input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--uib); background: rgba(0,0,0,.35); color: #fff; width: 100%; }
      #overlay button { font: inherit; font-weight: 800; padding: 14px; border-radius: 10px; border: 0; background: var(--acc); color: #1a1200; }
      #err { color: #ff8a80; min-height: 18px; font-size: 13px; }
      #rotate { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #101820; text-align: center; font-size: 18px; padding: 24px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="leftZone" class="zone"><div class="joy-base" id="joyBase"><div class="joy-knob" id="joyKnob"></div></div></div>
      <div id="rightZone" class="zone"></div>
      <div id="crosshair"><i class="l"></i><i class="r"></i><i class="t"></i><i class="b"></i><i class="d"></i></div>
      <div id="hitMark"></div><div id="hitHead"></div><div id="hitKill"></div>
      <div id="dmgFlash"></div>
      <div id="roundBox"><div id="roundTime"></div><div id="roundGoal"></div></div>
      <div id="hud">
        <div id="hpbar"><div id="hpfill"></div></div>
        <div id="weaponName"></div>
        <div id="score"></div>
      </div>
      <div id="wHud"><div id="wMain"><div id="wIcon"></div><div><span id="wMag"></span><span id="wMagMax"></span></div><div id="wName"></div><div id="wRel"><div id="wRelFill"></div></div><div id="wState"></div><div id="wSlots"><span class="slot"></span><span class="slot"></span><span class="slot"></span></div></div></div>
      <canvas id="minimap" width="224" height="224"></canvas>
      <div id="ping"></div>
      <div id="feed"></div>
      <div id="toast"></div>
      <div id="btnWeapon" class="btn">Waffe</div>
      <div id="btnReload" class="btn">Nach-<br>laden</div>
      <div id="btnFire" class="btn">Feuer</div>
      <div id="endBoard"></div>
      <div id="dead"><div>Ausgeschaltet &ndash; Respawn gleich&hellip;</div></div>
    </div>
    <div id="overlay">
      <div class="card">
        <h1>Stadtkampf</h1>
        <p>Name und Raumcode eingeben, dann geht es los.</p>
        <input id="name" placeholder="Dein Name" maxlength="16" autocomplete="off" />
        <input id="room" placeholder="Raumcode" maxlength="24" autocomplete="off" autocapitalize="off" />
        <button id="play">Spielen</button>
        <div id="err"></div>
        <p>Tipp: Im Browser-Menü „Zum Home-Bildschirm" wählen, dann läuft das Spiel im Vollbild.</p>
      </div>
    </div>
    <div id="rotate">Bitte das Handy quer halten.</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
