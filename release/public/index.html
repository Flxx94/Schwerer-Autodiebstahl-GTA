<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#101820" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>Schwerer Autodiebstahl</title>
    <style>
      :root { --ui: rgba(255,255,255,.18); --uib: rgba(255,255,255,.55); --acc: #ffb020; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; color: #fff;
        font: 15px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
      canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { position: absolute; }
      .zone { pointer-events: auto; touch-action: none; }
      #leftZone { left: 0; bottom: 0; width: 45%; height: 70%; }
      #rightZone { right: 0; bottom: 0; width: 55%; height: 70%; }
      .joy-base { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
        border: 2px solid var(--uib); background: var(--ui); display: none; }
      .joy-knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
        border-radius: 50%; background: var(--uib); }
      .btn { pointer-events: auto; touch-action: none; display: flex; align-items: center; justify-content: center;
        border-radius: 50%; border: 2px solid var(--uib); background: var(--ui); color: #fff; font-weight: 700;
        text-align: center; font-size: 13px; backdrop-filter: blur(2px); }
      .btn:active, .btn.on { background: rgba(255,176,32,.55); }
      #btnFire { right: calc(18px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 96px; height: 96px; font-size: 16px; }
      #btnEnter { right: calc(130px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); width: 70px; height: 70px; }
      #btnSpawn { right: calc(30px + env(safe-area-inset-right)); bottom: calc(132px + env(safe-area-inset-bottom)); width: 66px; height: 66px; }
      #btnWeapon { right: calc(110px + env(safe-area-inset-right)); bottom: calc(110px + env(safe-area-inset-bottom)); width: 62px; height: 62px; }
      #spawnMenu { right: calc(110px + env(safe-area-inset-right)); bottom: calc(190px + env(safe-area-inset-bottom)); display: none; gap: 10px; pointer-events: auto; }
      #spawnMenu.open { display: flex; }
      #spawnMenu .btn { width: 78px; height: 78px; border-radius: 16px; }
      #throttle { right: calc(196px + env(safe-area-inset-right)); top: 22%; width: 50px; height: 32%; display: none; pointer-events: auto; touch-action: none;
        border: 2px solid var(--uib); border-radius: 27px; background: var(--ui); }
      #throttleFill { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,176,32,.55); border-radius: 0 0 25px 25px; }
      #throttleLabel { position: absolute; left: 0; right: 0; top: -20px; text-align: center; font-size: 12px; text-shadow: 0 1px 2px #000; }
      #crosshair { left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); }
      #hud { left: calc(12px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); text-shadow: 0 1px 3px #000; }
      #hpbar { width: 150px; height: 12px; border: 2px solid var(--uib); border-radius: 7px; overflow: hidden; background: rgba(0,0,0,.35); }
      #hpfill { height: 100%; width: 100%; background: #4ade80; }
      #weaponName { margin-top: 4px; font-weight: 700; }
      #speedo { margin-top: 2px; font-size: 13px; opacity: .9; }
      #score { margin-top: 6px; font-size: 12px; opacity: .9; white-space: pre; }
      #minimap { right: calc(12px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); width: 112px; height: 112px; border-radius: 50%;
        border: 2px solid var(--uib); background: rgba(0,0,0,.35); }
      #ping { right: calc(130px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); font-size: 12px; opacity: .8; text-shadow: 0 1px 3px #000; }
      #feed { left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%); text-align: center; font-size: 13px; text-shadow: 0 1px 3px #000; }
      #toast { left: 50%; top: 22%; transform: translateX(-50%); text-align: center; font-size: 18px; font-weight: 700; text-shadow: 0 2px 4px #000; }
      #dead { inset: 0; display: none; align-items: center; justify-content: center; background: rgba(120,0,0,.35); font-size: 24px; font-weight: 800; text-shadow: 0 2px 6px #000; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #25405a, #0b1118); z-index: 10; padding: 16px; }
      #overlay .card { width: min(380px, 100%); display: flex; flex-direction: column; gap: 10px; }
      #overlay h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .5px; }
      #overlay p { margin: 0; opacity: .75; font-size: 13px; }
      #overlay input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--uib); background: rgba(0,0,0,.35); color: #fff; width: 100%; }
      #overlay button { font: inherit; font-weight: 800; padding: 14px; border-radius: 10px; border: 0; background: var(--acc); color: #1a1200; }
      #err { color: #ff8a80; min-height: 18px; font-size: 13px; }
      #rotate { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #101820; text-align: center; font-size: 18px; padding: 24px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="leftZone" class="zone"><div class="joy-base" id="joyBase"><div class="joy-knob" id="joyKnob"></div></div></div>
      <div id="rightZone" class="zone"></div>
      <div id="crosshair"></div>
      <div id="hud">
        <div id="hpbar"><div id="hpfill"></div></div>
        <div id="weaponName"></div>
        <div id="speedo"></div>
        <div id="score"></div>
      </div>
      <canvas id="minimap" width="224" height="224"></canvas>
      <div id="ping"></div>
      <div id="feed"></div>
      <div id="toast"></div>
      <div id="throttle"><div id="throttleLabel">Schub</div><div id="throttleFill"></div></div>
      <div id="spawnMenu"><div class="btn" id="spawnCar">Auto</div><div class="btn" id="spawnPlane">Flugzeug</div></div>
      <div id="btnSpawn" class="btn">Spawn</div>
      <div id="btnWeapon" class="btn">Waffe</div>
      <div id="btnEnter" class="btn">Einsteigen</div>
      <div id="btnFire" class="btn">Feuer</div>
      <div id="dead"><div>Ausgeschaltet &ndash; Respawn gleich&hellip;</div></div>
    </div>
    <div id="overlay">
      <div class="card">
        <h1>Schwerer Autodiebstahl</h1>
        <p>Name und Raumcode eingeben, dann geht es los.</p>
        <input id="name" placeholder="Dein Name" maxlength="16" autocomplete="off" />
        <input id="room" placeholder="Raumcode" maxlength="24" autocomplete="off" autocapitalize="off" />
        <button id="play">Spielen</button>
        <div id="err"></div>
        <p>Tipp: Im Browser-Menü „Zum Home-Bildschirm" wählen, dann läuft das Spiel im Vollbild.</p>
      </div>
    </div>
    <div id="rotate">Bitte das Handy quer halten.</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
